x-self-hosted-dev-storage-environment: &self-hosted-dev-storage-environment
  S3_ENDPOINT: "http://minio:9000"
  S3_UPLOAD_ENDPOINT: "http://minio:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "${MINIO_BUCKET:-waoowaoo}"
  S3_ACCESS_KEY_ID: "${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY in the selected development env file}"
  S3_SECRET_ACCESS_KEY: "${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in the selected development env file}"
  S3_SESSION_TOKEN: ""
  S3_FORCE_PATH_STYLE: "true"

services:
  app-dev:
    environment: *self-hosted-dev-storage-environment
    depends_on:
      minio-init:
        condition: service_completed_successfully

  temporal-worker-dev:
    environment: *self-hosted-dev-storage-environment
    depends_on:
      minio-init:
        condition: service_completed_successfully
